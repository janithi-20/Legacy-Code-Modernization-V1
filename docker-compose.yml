services:
  legacy_db:
    image: postgres:16
    container_name: legacy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legacy
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - legacy_data:/var/lib/postgresql/data

  cloud_db:
    image: postgres:16
    container_name: cloud_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud
    ports:
      - "5434:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - cloud_data:/var/lib/postgresql/data

volumes:
  legacy_data:
  cloud_data: